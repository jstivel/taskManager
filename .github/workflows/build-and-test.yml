name: Java CI/CD - Build and Test

on:
  push:
    branches: [ "main" ] # Triggers on push to the main branch
  pull_request:
    branches: [ "main" ] # Also triggers when a pull request is opened/updated against main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # 1. Obtiene el código

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # 2. Configura Java y Maven

      - name: Build, Test, and Package 🛠️
        run: mvn clean install -DskipTests=false # 3. Compila y ejecuta todas las pruebas